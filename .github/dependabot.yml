# Dependabot keeps the actions the workflows call and the packages Directory.Packages.props pins current: every two
# months, at 06:00 UTC on the first day of an odd month (there is no two-month interval, so a cron names the months),
# the actions in one pull request, the packages' minor and patch updates in another, each major update in its own.
# Security updates do not wait for the schedule. The shared workflows are called by their major tag (@v1): Dependabot
# proposes the next major when Snail.Sdk releases one.
# Snail.Sdk and its levels come in one pull request of their own, a major update too: global.json names them apart,
# but they are released together and build only at one version.
# ModelContextProtocol is not proposed at all: ModelContextProtocol.AspNetCore comes with Snail.Sdk.Mcp and asks for
# one exact version, so a bump of its own fails restore (NU1608, 2026-11-13). It moves by hand with Snail.Sdk.Mcp.
# The majors of Microsoft.Extensions.* and Microsoft.Data.* follow .NET's and wait for the move to that .NET.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1 1,3,5,7,9,11 *'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1 1,3,5,7,9,11 *'
    groups:
      snail-sdk:
        patterns: ['Snail.Sdk*']
      packages:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'ModelContextProtocol*'
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.Data.*'
        update-types: ['version-update:semver-major']
