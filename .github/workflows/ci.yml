name: build and tests

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # A Mac: the server reads ps, lsof, simctl and the keychain the way macOS prints them.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}

      - run: dotnet restore Snail.MCP.CleanUp.slnx

      - run: dotnet build Snail.MCP.CleanUp.slnx -c Release --no-restore

      # The machine tests are skipped here; they say so rather than pass.
      - name: Tests
        run: >
          dotnet test Snail.MCP.CleanUp.slnx -c Release --no-build
          --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test results
          path: artifacts/tests

  native:
    # The native program, as it is published and packed: a trim or AOT warning is a call that fails at run time, and
    # only the program started over stdio shows that every tool still answers.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish native
        run: |
          dotnet publish src/Server -c Release -r osx-arm64 2>&1 | tee publish.log
          if grep -E "warning (IL|AOT)[0-9]+" publish.log; then
            echo "::error::the native build warned"
            exit 1
          fi

      - name: Answers over stdio
        env:
          SNAIL_CLEANUP_SERVER: ${{ github.workspace }}/src/Server/bin/Release/net10.0/osx-arm64/publish/Snail.MCP.CleanUp
        run: dotnet test tests -c Release --filter "FullyQualifiedName~StdioContract"
