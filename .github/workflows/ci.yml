name: build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # A Mac: the server reads ps, lsof, simctl and the keychain the way macOS prints them.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}

      - run: dotnet restore Snail.MCP.CleanUp.slnx

      - run: dotnet build Snail.MCP.CleanUp.slnx -c Release --no-restore

      # The machine tests are skipped here; they say so rather than pass.
      - name: Tests
        run: >
          dotnet test Snail.MCP.CleanUp.slnx -c Release --no-build
          --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test results
          path: artifacts/tests
