name: build and tests

# The shared server CI of Snail.Sdk. The tests run on a Mac: the server reads ps, lsof, simctl and the keychain the way
# macOS prints them. The native program is built for each platform it ships to and asked over stdio where it runs.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: orldev/Snail.Sdk/.github/workflows/mcp-ci.yml@v1
    with:
      project: src/Server
      os: macos-latest
      contract-variable: SNAIL_CLEANUP_SERVER
      contract-filter: FullyQualifiedName~StdioContract
